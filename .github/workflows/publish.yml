name: Publish images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack compressed feed files
        run: |
          # The scheduled style run uploads feed.tsv.gz and images.txt.gz through the
          # GitHub website (browser uploads are size-limited). If present, they replace
          # feed.tsv / images.txt for this build.
          if [ -f feed.tsv.gz ]; then gunzip -c feed.tsv.gz > feed.tsv; fi
          if [ -f images.txt.gz ]; then gunzip -c images.txt.gz > images.txt; fi
          wc -l feed.tsv images.txt
      - name: Download images
        run: |
          mkdir -p site/img
          # id url per line; 8 downloads at a time, 3 retries each
          cat images.txt | xargs -P 8 -n 2 sh -c 'curl -sSfL --retry 3 -o "site/img/$0.jpg" "$1" || echo "FAILED $0"' | tee failed.txt
          echo "Downloaded $(ls site/img | wc -l) of $(wc -l < images.txt) images; $(grep -c FAILED failed.txt || true) failed"
          cp feed.tsv site/feed.tsv
          printf 'User-agent: *\nAllow: /\n' > site/robots.txt
          echo '<p>Popcorn Prints images</p>' > site/index.html
          du -sh site
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a23d3fa9eeb6145283fd04e0162912dc
        run: |
          set +e
          npx --yes wrangler@4 pages project create popcorn-images --production-branch main > create.log 2>&1
          echo "::notice::project create: $(tail -c 300 create.log | tr '\n' ' ')"
          npx --yes wrangler@4 pages deploy site --project-name popcorn-images --branch main --commit-dirty=true > deploy.log 2>&1
          rc=$?
          echo "::notice::deploy: $(tail -c 900 deploy.log | tr '\n' ' ')"
          exit $rc
      - name: Keep the 50-image GitHub test site
        run: |
          mkdir -p gh/img
          while read -r id; do cp "site/img/$id.jpg" gh/img/ 2>/dev/null || echo "missing $id"; done < test_ids.txt
          cp site/robots.txt site/index.html gh/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gh
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
